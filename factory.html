<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>施設経営ゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1923;
      color: #e0e6ed;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 4px;
      color: #ffd700;
      letter-spacing: 2px;
    }
    /* Money bar */
    #money-bar {
      background: #1a2634;
      border: 1px solid #2a3a4a;
      border-radius: 12px;
      padding: 12px 24px;
      margin: 12px 0;
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    #money-bar .label { font-size: 11px; color: #7a8fa0; letter-spacing: 1px; text-transform: uppercase; }
    #money-display { font-size: 36px; font-weight: bold; color: #ffd700; }
    #income-display { font-size: 13px; color: #4ec9b0; margin-top: 2px; }

    /* Slots */
    #slots {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }
    .slot {
      background: #1a2634;
      border: 2px dashed #2a3a4a;
      border-radius: 14px;
      padding: 16px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .slot:active { background: #1e2e40; }
    .slot.empty { border-color: #2a3a4a; }
    .slot.empty:hover { border-color: #4a6a8a; }
    .slot.occupied { border: 2px solid; cursor: default; }
    .slot-empty-label { color: #3a5a7a; font-size: 14px; }

    .building-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .building-icon { font-size: 40px; line-height: 1; }
    .building-info { flex: 1; }
    .building-name { font-size: 17px; font-weight: bold; }
    .building-income { font-size: 13px; color: #4ec9b0; margin-top: 2px; }
    .building-level { font-size: 12px; color: #7a8fa0; margin-top: 2px; }
    .slot-actions { display: flex; flex-direction: column; gap: 6px; }
    .btn-upgrade, .btn-demolish {
      border: none; border-radius: 8px; padding: 6px 12px;
      font-size: 12px; font-weight: bold; cursor: pointer;
      transition: opacity 0.1s;
    }
    .btn-upgrade { background: #2a6496; color: #fff; }
    .btn-upgrade:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-demolish { background: #6b3030; color: #ffaaaa; }
    .btn-upgrade:active { opacity: 0.8; }
    .btn-demolish:active { opacity: 0.8; }

    /* Shop modal */
    #modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    #modal-bg.open { display: flex; }
    #modal {
      background: #1a2634;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 32px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
    }
    #modal h2 { font-size: 16px; color: #aaa; margin-bottom: 14px; text-align: center; }
    .shop-item {
      background: #0f1923;
      border: 1px solid #2a3a4a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .shop-item:active { border-color: #4a8fc0; }
    .shop-item.unaffordable { opacity: 0.45; cursor: not-allowed; }
    .shop-icon { font-size: 34px; }
    .shop-info { flex: 1; }
    .shop-name { font-size: 16px; font-weight: bold; }
    .shop-desc { font-size: 12px; color: #7a8fa0; margin-top: 2px; }
    .shop-income { font-size: 12px; color: #4ec9b0; margin-top: 2px; }
    .shop-cost { font-size: 15px; font-weight: bold; color: #ffd700; }
    #modal-cancel {
      width: 100%; margin-top: 8px; padding: 14px;
      background: #2a3a4a; border: none; border-radius: 12px;
      color: #aaa; font-size: 15px; cursor: pointer;
    }

    /* Income pop */
    .income-pop {
      position: absolute;
      color: #4ec9b0;
      font-size: 15px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 1.2s ease-out forwards;
      top: 10px; right: 16px;
      z-index: 10;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }

    #log {
      width: 100%; max-width: 420px;
      font-size: 12px; color: #4a6a8a;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>🏭 施設経営</h1>

<div id="money-bar">
  <div class="label">所持金</div>
  <div id="money-display">¥100</div>
  <div id="income-display">収入: ¥0 / 秒</div>
</div>

<div id="slots">
  <div class="slot empty" id="slot-0" onclick="openShop(0)">
    <span class="slot-empty-label">＋ 施設を建設する</span>
  </div>
  <div class="slot empty" id="slot-1" onclick="openShop(1)">
    <span class="slot-empty-label">＋ 施設を建設する</span>
  </div>
  <div class="slot empty" id="slot-2" onclick="openShop(2)">
    <span class="slot-empty-label">＋ 施設を建設する</span>
  </div>
</div>

<div id="log"></div>

<!-- Shop modal -->
<div id="modal-bg">
  <div id="modal">
    <h2>建設する施設を選んでください</h2>
    <div id="shop-list"></div>
    <button id="modal-cancel" onclick="closeShop()">キャンセル</button>
  </div>
</div>

<script>
// ---- Building definitions ----
const BUILDINGS = [
  {
    id: 'farm',
    name: '農場',
    icon: '🌾',
    desc: '野菜や果物を育てて販売する',
    baseCost: 30,
    baseIncome: 3,
    color: '#4a7a3a',
    upgradeMult: 2.5,
  },
  {
    id: 'shop',
    name: '商店',
    icon: '🏪',
    desc: '地域の人々に日用品を販売する',
    baseCost: 100,
    baseIncome: 12,
    color: '#2a6496',
    upgradeMult: 2.5,
  },
  {
    id: 'factory',
    name: '工場',
    icon: '🏭',
    desc: '製品を製造して卸売りする',
    baseCost: 300,
    baseIncome: 40,
    color: '#7a4a2a',
    upgradeMult: 2.5,
  },
  {
    id: 'bank',
    name: '銀行',
    icon: '🏦',
    desc: '利子収入と金融サービスで稼ぐ',
    baseCost: 800,
    baseIncome: 120,
    color: '#6a4a8a',
    upgradeMult: 2.5,
  },
  {
    id: 'lab',
    name: '研究所',
    icon: '🔬',
    desc: '先端技術の研究で莫大な収益を得る',
    baseCost: 2000,
    baseIncome: 350,
    color: '#1a7a8a',
    upgradeMult: 2.5,
  },
];

// ---- State ----
let money = 100;
let slots = [null, null, null]; // each: { buildingId, level }
let selectedSlot = null;

function getBuildingDef(id) { return BUILDINGS.find(b => b.id === id); }

function slotIncome(slot) {
  if (!slot) return 0;
  const def = getBuildingDef(slot.buildingId);
  return Math.round(def.baseIncome * Math.pow(slot.level, 1.5));
}

function upgradeCost(slot) {
  if (!slot) return 0;
  const def = getBuildingDef(slot.buildingId);
  return Math.round(def.baseCost * Math.pow(def.upgradeMult, slot.level));
}

function totalIncome() { return slots.reduce((s, sl) => s + slotIncome(sl), 0); }

// ---- Rendering ----
function fmt(n) {
  if (n >= 1_000_000) return '¥' + (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return '¥' + (n / 1_000).toFixed(1) + 'K';
  return '¥' + Math.floor(n);
}

function render() {
  document.getElementById('money-display').textContent = fmt(money);
  document.getElementById('income-display').textContent = `収入: ${fmt(totalIncome())} / 秒`;

  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`slot-${i}`);
    const slot = slots[i];
    if (!slot) {
      el.className = 'slot empty';
      el.onclick = () => openShop(i);
      el.innerHTML = `<span class="slot-empty-label">＋ 施設を建設する</span>`;
    } else {
      const def = getBuildingDef(slot.buildingId);
      const inc = slotIncome(slot);
      const upCost = upgradeCost(slot);
      const canUpgrade = money >= upCost;
      el.className = 'slot occupied';
      el.style.borderColor = def.color;
      el.onclick = null;
      el.innerHTML = `
        <div class="building-card">
          <div class="building-icon">${def.icon}</div>
          <div class="building-info">
            <div class="building-name">${def.name}</div>
            <div class="building-income">+${fmt(inc)} / 秒</div>
            <div class="building-level">Lv.${slot.level}</div>
          </div>
          <div class="slot-actions">
            <button class="btn-upgrade" ${canUpgrade ? '' : 'disabled'}
              onclick="upgradeSlot(${i})">
              強化<br><small>${fmt(upCost)}</small>
            </button>
            <button class="btn-demolish" onclick="demolishSlot(${i})">撤去</button>
          </div>
        </div>`;
    }
  }
}

// ---- Income tick ----
const TICK_MS = 200; // tick every 200ms, income = totalIncome() * 0.2
let lastPop = [0, 0, 0];

setInterval(() => {
  const inc = totalIncome() * (TICK_MS / 1000);
  money += inc;
  render();

  // Show pop animations
  for (let i = 0; i < 3; i++) {
    if (!slots[i]) continue;
    lastPop[i] += TICK_MS;
    if (lastPop[i] >= 1000) {
      lastPop[i] = 0;
      showPop(i, slotIncome(slots[i]));
    }
  }
}, TICK_MS);

function showPop(slotIdx, amount) {
  const el = document.getElementById(`slot-${slotIdx}`);
  const pop = document.createElement('div');
  pop.className = 'income-pop';
  pop.textContent = `+${fmt(amount)}`;
  el.appendChild(pop);
  setTimeout(() => pop.remove(), 1200);
}

// ---- Shop ----
function openShop(slotIdx) {
  selectedSlot = slotIdx;
  const list = document.getElementById('shop-list');
  list.innerHTML = '';
  for (const def of BUILDINGS) {
    const affordable = money >= def.baseCost;
    const div = document.createElement('div');
    div.className = 'shop-item' + (affordable ? '' : ' unaffordable');
    div.innerHTML = `
      <div class="shop-icon">${def.icon}</div>
      <div class="shop-info">
        <div class="shop-name">${def.name}</div>
        <div class="shop-desc">${def.desc}</div>
        <div class="shop-income">+${fmt(def.baseIncome)} / 秒 (Lv.1)</div>
      </div>
      <div class="shop-cost">${fmt(def.baseCost)}</div>`;
    if (affordable) div.onclick = () => placeBuilding(def.id);
    list.appendChild(div);
  }
  document.getElementById('modal-bg').classList.add('open');
}

function closeShop() {
  document.getElementById('modal-bg').classList.remove('open');
  selectedSlot = null;
}

document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-bg')) closeShop();
});

function placeBuilding(buildingId) {
  const def = getBuildingDef(buildingId);
  if (money < def.baseCost) return;
  money -= def.baseCost;
  slots[selectedSlot] = { buildingId, level: 1 };
  closeShop();
  log(`${def.icon} ${def.name}を建設しました`);
  render();
}

// ---- Upgrade / Demolish ----
function upgradeSlot(i) {
  const slot = slots[i];
  if (!slot) return;
  const cost = upgradeCost(slot);
  if (money < cost) return;
  money -= cost;
  slot.level++;
  const def = getBuildingDef(slot.buildingId);
  log(`${def.icon} ${def.name}をLv.${slot.level}に強化しました`);
  render();
}

function demolishSlot(i) {
  const slot = slots[i];
  if (!slot) return;
  const def = getBuildingDef(slot.buildingId);
  // refund 30%
  const refund = Math.round(def.baseCost * 0.3);
  money += refund;
  slots[i] = null;
  log(`${def.icon} ${def.name}を撤去しました（${fmt(refund)}返還）`);
  render();
}

// ---- Log ----
function log(msg) {
  document.getElementById('log').textContent = msg;
}

// Initial render
render();
</script>
</body>
</html>
