<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>バブルポップ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
      padding: 12px 16px;
      color: #fff;
    }
    .stat { text-align: center; }
    .stat-label { font-size: 11px; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }
    .stat-value { font-size: 28px; font-weight: bold; }
    #timer-value { color: #ff6b6b; }
    #score-value { color: #ffd700; }
    #combo-value { color: #a8edea; }
    #canvas {
      border-radius: 16px;
      display: block;
      cursor: pointer;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 { font-size: 40px; margin-bottom: 8px; }
    #overlay p  { font-size: 16px; color: #ccc; margin-bottom: 24px; }
    #start-btn {
      background: linear-gradient(135deg, #ff6b6b, #ffd700);
      border: none;
      padding: 16px 48px;
      font-size: 20px;
      border-radius: 50px;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,107,107,0.4);
      transition: transform 0.1s;
    }
    #start-btn:active { transform: scale(0.96); }
    #result-score { font-size: 64px; font-weight: bold; color: #ffd700; margin: 12px 0; }
    #result-label { font-size: 18px; color: #aaa; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="stat">
      <div class="stat-label">スコア</div>
      <div class="stat-value" id="score-value">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">残り時間</div>
      <div class="stat-value" id="timer-value">30</div>
    </div>
    <div class="stat">
      <div class="stat-label">コンボ</div>
      <div class="stat-value" id="combo-value">x1</div>
    </div>
  </div>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <div id="start-screen">
      <h1>🫧 バブルポップ</h1>
      <p>泡が消える前にタップしよう！<br>連続でタップするとコンボボーナス！</p>
      <button id="start-btn">スタート</button>
    </div>
    <div id="result-screen" class="hidden">
      <div id="result-label">ゲームオーバー</div>
      <div id="result-score">0</div>
      <p id="result-msg"></p>
      <button id="start-btn" style="margin-top:8px">もう一回</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startScreen = document.getElementById('start-screen');
  const resultScreen = document.getElementById('result-screen');
  const resultScoreEl = document.getElementById('result-score');
  const resultMsgEl = document.getElementById('result-msg');
  const scoreEl = document.getElementById('score-value');
  const timerEl = document.getElementById('timer-value');
  const comboEl = document.getElementById('combo-value');

  let W, H;
  function resize() {
    const maxW = Math.min(window.innerWidth, 420);
    const maxH = window.innerHeight - 80;
    W = canvas.width  = Math.min(maxW, maxH * 0.72);
    H = canvas.height = W * 1.38;
  }
  resize();
  window.addEventListener('resize', () => { resize(); });

  const COLORS = [
    ['#ff6b6b','#ff8e8e'],['#ffd700','#ffe566'],['#a8edea','#c8f5f3'],
    ['#fd79a8','#fdadc8'],['#6c5ce7','#a29bfe'],['#00cec9','#55efc4'],
    ['#e17055','#fab1a0'],['#74b9ff','#a8d8ff'],
  ];

  const GAME_DURATION = 30;
  let bubbles, score, combo, comboTimer, timeLeft, running, animId, tickId;
  let particles = [];

  function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

  function spawnBubble() {
    const minR = W * 0.07, maxR = W * 0.14;
    const r = minR + Math.random() * (maxR - minR);
    const x = r + Math.random() * (W - r * 2);
    const y = r + Math.random() * (H - r * 2);
    const lifespan = 1400 + Math.random() * 1200;
    const [c1, c2] = randomColor();
    const points = Math.round(100 * (minR / r));
    return { x, y, r, born: Date.now(), lifespan, c1, c2, points, alive: true, popAnim: 0 };
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, r: 3+Math.random()*4, color, life: 1 });
    }
  }

  function startGame() {
    bubbles = [];
    score = 0; combo = 1; comboTimer = 0;
    timeLeft = GAME_DURATION; running = true; particles = [];
    updateHUD();
    overlay.classList.add('hidden');
    cancelAnimationFrame(animId);
    clearInterval(tickId);

    for (let i = 0; i < 4; i++) bubbles.push(spawnBubble());

    tickId = setInterval(() => {
      if (!running) return;
      timeLeft--;
      if (timeLeft <= 0) endGame();
      updateHUD();
    }, 1000);

    setInterval(() => {
      if (!running) return;
      if (bubbles.filter(b => b.alive).length < 7) bubbles.push(spawnBubble());
    }, 500);

    loop();
  }

  function endGame() {
    running = false;
    clearInterval(tickId);
    cancelAnimationFrame(animId);

    resultScoreEl.textContent = score;
    const msgs = [
      [0,   'まだまだこれから！'],
      [500,  'なかなかやるね！'],
      [1200, 'すごい！バブルマスター！'],
      [2000, '🏆 伝説のバブルハンター！'],
    ];
    let msg = msgs[0][1];
    for (const [thresh, m] of msgs) if (score >= thresh) msg = m;
    resultMsgEl.textContent = msg;

    overlay.classList.remove('hidden');
    startScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');
  }

  function updateHUD() {
    scoreEl.textContent = score;
    timerEl.textContent = Math.max(timeLeft, 0);
    comboEl.textContent = `x${combo}`;
    timerEl.style.color = timeLeft <= 10 ? '#ff6b6b' : '#fff';
  }

  function popBubble(b) {
    if (!b.alive) return;
    b.alive = false;
    const pts = b.points * combo;
    score += pts;
    if (comboTimer) clearTimeout(comboTimer);
    combo = Math.min(combo + 1, 8);
    comboTimer = setTimeout(() => { combo = 1; updateHUD(); }, 800);
    spawnParticles(b.x, b.y, b.c1);
    showFloatingText(b.x, b.y, `+${pts}`);
    updateHUD();
  }

  let floatingTexts = [];
  function showFloatingText(x, y, text) {
    floatingTexts.push({ x, y, text, life: 1 });
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const touches = e.changedTouches || e.touches;
    if (touches && touches.length > 0) {
      return Array.from(touches).map(t => ({
        x: (t.clientX - rect.left) * scaleX,
        y: (t.clientY - rect.top)  * scaleY,
      }));
    }
    return [{ x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY }];
  }

  function handleTap(e) {
    e.preventDefault();
    if (!running) return;
    const points = getPos(e);
    for (const { x, y } of points) {
      for (const b of [...bubbles].reverse()) {
        if (!b.alive) continue;
        const dx = x - b.x, dy = y - b.y;
        if (dx*dx + dy*dy <= b.r*b.r) { popBubble(b); break; }
      }
    }
  }

  canvas.addEventListener('touchstart', handleTap, { passive: false });
  canvas.addEventListener('mousedown', handleTap);

  document.querySelectorAll('#start-btn').forEach(btn =>
    btn.addEventListener('click', startGame)
  );

  function loop() {
    animId = requestAnimationFrame(loop);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background gradient
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1a1a2e');
    bg.addColorStop(1, '#16213e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const now = Date.now();

    // Remove dead & expired bubbles
    bubbles = bubbles.filter(b => {
      if (!b.alive) return false;
      const age = (now - b.born) / b.lifespan;
      if (age >= 1) { if (running) { combo = 1; updateHUD(); } return false; }
      return true;
    });

    // Draw bubbles
    for (const b of bubbles) {
      const age = (now - b.born) / b.lifespan;
      const pulse = 1 + 0.04 * Math.sin(now / 200 + b.x);
      const r = b.r * pulse;
      const alpha = age < 0.7 ? 1 : 1 - (age - 0.7) / 0.3;

      ctx.save();
      ctx.globalAlpha = alpha;

      // Shadow glow
      ctx.shadowColor = b.c1;
      ctx.shadowBlur = 18;

      // Fill
      const grad = ctx.createRadialGradient(b.x - r*0.3, b.y - r*0.3, r*0.1, b.x, b.y, r);
      grad.addColorStop(0, b.c2);
      grad.addColorStop(1, b.c1);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI*2);
      ctx.fill();

      // Shine
      ctx.shadowBlur = 0;
      const shine = ctx.createRadialGradient(b.x - r*0.35, b.y - r*0.35, 0, b.x - r*0.35, b.y - r*0.35, r*0.55);
      shine.addColorStop(0, 'rgba(255,255,255,0.55)');
      shine.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = shine;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI*2);
      ctx.fill();

      // Points label
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = `bold ${Math.round(r*0.45)}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.points, b.x, b.y);

      // Countdown ring
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r + 3, -Math.PI/2, -Math.PI/2 + (1-age)*Math.PI*2);
      ctx.stroke();

      ctx.restore();
    }

    // Particles
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.04;
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    particles = particles.filter(p => p.life > 0);

    // Floating score texts
    for (const ft of floatingTexts) {
      ft.y -= 1.5;
      ft.life -= 0.03;
      ctx.save();
      ctx.globalAlpha = ft.life;
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 8;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
  }

  // Initial idle draw
  draw();
</script>
</body>
</html>
